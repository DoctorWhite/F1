spring:
  application:
    name: component-service

  datasource:
    url: jdbc:h2:mem:componentsdb
    driver-class-name: org.h2.Driver
    username: htwo
    password: passwd

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: none
    show-sql: false

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.xml

  h2:
    console:
      enabled: true
      path: /h2-console

  artemis:
    mode: ${SPRING_ARTEMIS_MODE:native}
    broker-url: ${SPRING_ARTEMIS_BROKER_URL:tcp://localhost:61616}
    user: ${ARTEMIS_USER:admin}
    password: ${ARTEMIS_PASSWORD:admin}

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://id.muni.cz/oidc/
          audiences:
            - 7e02a0a9-446a-412d-ad2b-90add47b0fdd

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      show-components: always
  health:
    probes:
      enabled: true

server:
  port: 8081

api:
  base-path: /api/v1

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    oauth:
      client-id: 7e02a0a9-446a-412d-ad2b-90add47b0fdd
      client-secret: 48a2b2e3-4b2b-471e-b7b7-b81a85b6eeef22f347f2-3fc9-4e16-8698-3e2492701a89
      scopes:
        - openid
        - test_read
        - test_write

logging:
  level:
    liquibase: INFO

component-service:
  jms:
    car-assembly-queue: car.assembly.completed
    listener-concurrency: 1
