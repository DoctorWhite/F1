spring:
    application:
      name: car-service

    datasource:
      url: jdbc:h2:mem:cardb
      driver-class-name: org.h2.Driver
      username: sa
      password:

    h2:
      console:
        enabled: true
        path: /h2-console

    jpa:
      hibernate:
        ddl-auto: validate
      show-sql: true
      properties:
        hibernate:
          format_sql: true

    flyway:
      enabled: true
      locations: classpath:db/migration
      clean-disabled: false

    artemis:
      mode: native
      broker-url: "tcp://localhost:61616"
      user: admin
      password: admin

    security:
      oauth2:
        resourceserver:
          jwt:
            issuer-uri: https://id.muni.cz/oidc/

car-service:
    jms:
      car-assembly-queue: car.assembly.completed

springdoc:
    swagger-ui:
      oauth:
        client-id: 7e02a0a9-446a-412d-ad2b-90add47b0fdd
        client-secret: 48a2b2e3-4b2b-471e-b7b7-b81a85b6eeef22f347f2-3fc9-4e16-8698-3e2492701a89
        scopes:
          - openid
          - test_read
          - test_write

management:
    endpoints:
      web:
        exposure:
          include: health,info,metrics,prometheus
    endpoint:
      health:
        show-details: always
    prometheus:
      metrics:
        export:
          enabled: true

server:
    port: 8083
    servlet:
      context-path: /api/v1
