spring:
  application:
    name: driver-service

  datasource:
    url: jdbc:h2:mem:driverdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: none
    show-sql: false

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.xml

  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: always

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://id.muni.cz/oidc/
          audiences:
            - 7e02a0a9-446a-412d-ad2b-90add47b0fdd

  artemis:
    mode: ${SPRING_ARTEMIS_MODE:embedded}
    broker-url: ${SPRING_ARTEMIS_BROKER_URL:tcp://localhost:61616}
    user: ${ARTEMIS_USER:admin}
    password: ${ARTEMIS_PASSWORD:admin}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      show-components: always
  health:
    probes:
      enabled: true

server:
  port: 8080

api:
  base-path: /api/v1

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    oauth:
      client-id: 7e02a0a9-446a-412d-ad2b-90add47b0fdd
      client-secret: 48a2b2e3-4b2b-471e-b7b7-b81a85b6eeef22f347f2-3fc9-4e16-8698-3e2492701a89
      scopes:
        - openid
        - test_read
        - test_write

logging:
  level:
    liquibase: INFO

driver-service:
  batch:
    chunk-size: 10
  jms:
    telemetry-queue: telemetry.events
  oauth:
    token-url: https://id.muni.cz/oidc/token
    client-id: 7e02a0a9-446a-412d-ad2b-90add47b0fdd
    client-secret: 48a2b2e3-4b2b-471e-b7b7-b81a85b6eeef22f347f2-3fc9-4e16-8698-3e2492701a89
    redirect-uri: http://localhost:8080/login/oauth2/code/muni
  wet-weather-weight: 0.45
  dry-weather-weight: 0.20
  mixed-weather-weight: 0.30
  consistency-weight: 0.30
  aggressiveness-weight: 0.15
  feedback-weight: 0.10
  technical-demand-feedback-bonus: 0.20
